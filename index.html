<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h3>Cadastre seu veículo para vender mais rápido</h3>
    </header>
    <div class="form-container">
        <div class="form-header">
            <p><strong>Formulário</strong></p>
        </div>
        <div class="form-body">
            <h1 class="titulo-form">Venda seu carro de forma fácil</h1>
            <p>Descreva as caracteristicas dos seu carro e marque os opcionais que ele possui</p>
            <form onsubmit="salvarCarros(event)">
                <div class="caixaInputs">
                    <label for="title">Titulo do anúncio <span class="campo-obrigatorio">*</span></label>
                    <input type="text" name="title" id="title" class="block" placeholder="Um titulo para anuciar seu carro">
                </div>
                <div class="caixaInputs">
                    <label for="preco">Preço<span class="campo-obrigatorio">*</span></label>
                    <input type="number" name="preco" id="preco" class="block" placeholder="Defina o preço">
                </div>
                <div class="caixaInputs">
                    <label for="descricao">Descrição<span class="campo-obrigatorio">*</span></label>
                    <textarea name="descricao" id="descricao" class="block"></textarea>
                </div>
                <div class="caixaInputs">
                    <label for="marca">Marca<span class="campo-obrigatorio">*</span></label>
                    <input type="text" name="marca" id="marca" class="block" placeholder="Defina a marca do seu carro">
                </div>
                <div class="caixaInputs">
                    <label for="modelo">Modelo<span class="campo-obrigatorio">*</span></label>
                    <input type="text" name="modelo" id="modelo" class="block" placeholder="Defina a marca do seu carro">
                </div>
                <div class="caixaInputs">
                    <label for="kilometragem">Kilometragem<span class="campo-obrigatorio">*</span></label>
                    <input type="number" name="kilometragem" id="kilometragem" class="block" placeholder="Kilometragem do seu carro">
                </div>
                <div class="caixaInputs">
                    <label for="dataDeCompra">Data de compra<span class="campo-obrigatorio">*</span></label>
                    <input type="date" name="DataDeCompra" id="DataDeCompra" class="block">
                </div>
                 <div class="caixaInputs">
                    <p>Tipo de câmbio: <span class="campo-obrigatorio">*</span></p>
                    <input type="radio" name="marcha" id="manual">
                    <label for="manual">Manual</label>
                     <input type="radio" name="marcha" id="auto">
                    <label for="manual">Automatico</label>
                </div>
                <div class="caixaOpcional">
                    <p>Opcionais</p>
                    <ul class="listaOpcionais">
                        <li>
                            <input type="checkbox" name="opcional[]" id="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="alarme">
                            <label for="alarme">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="arCondicionado">
                            <label for="arCondicionado">Ar condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="cameraDeRe">
                            <label for="cameraDeRe">Camera de ré</label>
                        </li>
                    </ul>
                </div>
                <div class="caixaOpcionais">
                    <ul class="listaOpcionais">
                        <li>
                            <input type="checkbox" name="opcional[]" id="assistentePista">
                            <label for="assistentePista">Assistente de pista</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="partidaSemChave">
                            <label for="partidaSemChave">Partida sem chave</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="integraçãoCelular">
                            <label for="integraçãoCelular">Integração com celular</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="bancoDeCouro">
                            <label for="bancoDeCouro">Banco de couro</label>
                        </li>
                    </ul>
                </div>
                <div class="caixaInputs">
                    <p>Fotos do carro <span class="campo-obrigatorio">*</span></p>
                    <input type="file" name="imagem" id="imagem" multiple accept="image/png, image/jpg">
                </div>
                <input type="submit" value="Enviar" class="submit">
            </form>
            <hr>
            <h2>carros cadastrados</h2>
            <div id="listarCarros"></div>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
