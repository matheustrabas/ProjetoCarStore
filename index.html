<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h3>Cadastre seu veículo para vender mais rápido</h3>
    </header>
    <div>
        <div>
            <p>Fomulário</p>
        </div>
        <div>
            <h1>Venda facil seu carro</h1>
            <p>Descreva as caracteristicas dos seu carro e marque os opcionais que ele possui</p>
            <form>
                <div>
                    <label for="title">Titulo do anúncio <span>*</span></label>
                    <input type="text" name="title" id="title" placeholder="Um titulo para anuciar seu carro">
                </div>
                <div>
                    <label for="preco">Preço<span>*</span></label>
                    <input type="number" name="preco" id="preco" placeholder="Defina o preço">
                </div>
                <div>
                    <label for="descricao">Descrição<span>*</span></label>
                    <textarea name="descricao" id="descricao"></textarea>
                </div>
                <div>
                    <label for="marca">Marca<span>*</span></label>
                    <input type="text" name="marca" id="marca" placeholder="Defina a marca do seu carro">
                </div>
                <div>
                    <label for="modelo">Modelo<span>*</span></label>
                    <input type="text" name="modelo" id="modelo" placeholder="Defina a marca do seu carro">
                </div>
                <div>
                    <label for="kilometragem">Kilometragem<span>*</span></label>
                    <input type="number" name="kilometragem" id="kilometragem" placeholder="Kilometragem do seu carro">
                </div>
                <div>
                    <label for="dataDeCompra">Data de compra<span>*</span></label>
                    <input type="date" name="DataDeCompra" id="DataDeCompra">
                </div>
                 <div>
                    <p>Tipo de câmbio: <span>*</span></p>
                    <input type="radio" name="marcha" id="manual">
                    <label for="manual">Manual</label>
                     <input type="radio" name="marcha" id="auto">
                    <label for="manual">Automatico</label>
                </div>
                <div>
                    <p>Opcionais</p>
                    <ul>
                        <li>
                            <input type="checkbox" name="opcional[]" id="airbag">
                            <label for="airbag">Airbag</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="alarme">
                            <label for="alarme">Alarme</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="arCondicionado">
                            <label for="arCondicionado">Ar condicionado</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="cameraDeRe">
                            <label for="cameraDeRe">Camera de ré</label>
                        </li>
                    </ul>
                </div>
                <div>
                    <ul>
                        <li>
                            <input type="checkbox" name="opcional[]" id="assistentePista">
                            <label for="assistentePista">Assistente de pista</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="partidaSemChave">
                            <label for="partidaSemChave">Partida sem chave</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="integraçãoCelular">
                            <label for="integraçãoCelular">Integração com celular</label>
                        </li>
                        <li>
                            <input type="checkbox" name="opcional[]" id="bancoDeCouro">
                            <label for="bancoDeCouro">Banco de couro</label>
                        </li>
                    </ul>
                </div>
                <div>
                    <p>Fotos do carro <span>*</span></p>
                    <input type="file" name="imagem" id="imagem" multiple accept="image/png, image/jpg">
                </div>
                <input type="submit" value="Enviar">
            </form>
            <hr>
            <h2>carros cadastrados</h2>
            <div></div>
        </div>
    </div>
    <script src="script/script.js"></script>
</body>
</html>
