<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarStore</title>
</head>
<body>
    <header>
        <h3>Cadastre seu veículo para vender mais rápido</h3>
    </header>
    <div>
        <div>
            <p>Fomulário</p>
        </div>
        <div>
            <h1>Venda facil seu carro</h1>
            <p>Descreva as caracteristicas dos seu carro e marque os opcionais que ele possui</p>
            <form>
                <div>
                    <label for="title">Titulo do anúncio <span>*</span></label>
                    <input type="text" name="title" id="title" placeholder="Um titulo para anuciar seu carro">
                </div>
                <div>
                    <label for="preco">Preço <span>*</span></label>
                    <input type="number" name="preco" id="preco" placeholder="Defina o preço">
                </div>
                <div>
                    <label for="descricao">Descrição<span>*</span></label>
                    <textarea name="descricao" id="descricao"></textarea>
                </div>
                <div>
                    <label for="descricao">Descrição<span>*</span></label>
                    <textarea name="descricao" id="descricao"></textarea>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
